[package]
name = "ledger"
version = "0.1.1"
edition = "2024"

[dependencies]
arboard = "3"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = "0.29"
dirs = "6"
jiff = "0.2"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"
